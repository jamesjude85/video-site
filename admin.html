<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
  <h1>🎬 Admin Panel</h1>
  <div class="header-links">
    <a href="index.html" class="back-link">← Back to Home</a>
  </div>
</header>

  <main>
    <div class="admin-form">
      <h2>Add New Show</h2>

      <label for="title">Title:</label>
      <input type="text" id="title" placeholder="Show title">

      <label for="description">Description:</label>
      <textarea id="description" rows="3" placeholder="Show description"></textarea>

      <label for="thumbnail">Thumbnail URL:</label>
      <input type="text" id="thumbnail" placeholder="https://picsum.photos/640/360?random=99">

      <button onclick="addShow()">Add Show</button>
      <p id="message"></p>
    </div>

    <div class="admin-form">
      <h2>Upload Video</h2>
      <input type="file" id="videoFile" accept="video/*">
      <button onclick="uploadVideo()">Upload Video</button>
      <p id="uploadMessage"></p>
    </div>

    <div class="admin-form">
      <h2>Add Episode to Show</h2>

      <label for="showId">Show ID:</label>
      <input type="number" id="showId" placeholder="1">

      <label for="episodeTitle">Episode Title:</label>
      <input type="text" id="episodeTitle" placeholder="Episode 4 - New Adventure">

      <label for="episodeFile">Video File:</label>
      <input type="text" id="episodeFile" placeholder="/uploads/video.mp4">

      <button onclick="addEpisode()">Add Episode</button>
      <p id="episodeMessage"></p>
    </div>

    <div class="admin-list">
      <h2>Manage Shows</h2>
      <div id="showsList"></div>
    </div>
  </main>

  <script src="admin.js"></script>
</body>
</html>
